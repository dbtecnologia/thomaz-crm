var stages=['Novo lead','Primeiro contato','Em atendimento','Proposta enviada','Negociação','Ganho','Perdido'];var seed={users:[{id:1,n:'Camila Ferreira',e:'admin@thomaz.com',p:'123456',r:'Administrador'},{id:2,n:'Marcos Lima',e:'gestor@thomaz.com',p:'123456',r:'Gestor'},{id:3,n:'Ana Souza',e:'ana@thomaz.com',p:'123456',r:'Atendente'}],leads:[{id:1,n:'Mariana Costa',phone:'11999990001',email:'mariana@exemplo.com',interest:'Consultoria',source:'Indicação',owner:3,stage:1,next:'2026-09-30'},{id:2,n:'Rafael Almeida',phone:'11988887777',email:'rafael@almeida.com',interest:'Plano anual',source:'Site',owner:3,stage:0,next:'2026-10-01'},{id:3,n:'Lúcia Martins',phone:'11977776666',email:'lucia@martins.com',interest:'Implantação',source:'Instagram',owner:2,stage:5,next:''}],tasks:[{id:1,lead:1,title:'Enviar proposta revisada',due:'2026-09-30',done:false},{id:2,lead:2,title:'Fazer retorno comercial',due:'2026-09-28',done:false}],session:null};var db=JSON.parse(localStorage.getItem('thomaz-crm')||'null')||seed;var page='home',search='';var me=function(){return db.users.find(function(u){return u.id==db.session})};var who=function(id){var u=db.users.find(function(x){return x.id==id});return u?u.n:'Sem responsável'};var ini=function(n){return String(n||'').split(' ').map(function(x){return x[0]}).slice(0,2).join('').toUpperCase()};var esc=function(x){return String(x||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})};var save=function(){localStorage.setItem('thomaz-crm',JSON.stringify(db))};var fmt=function(d){return d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—'};function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(function(){e.remove()},2200)}
function login(){app.innerHTML='<main class="login"><section class="loginbox"><div class="brand"><span class="mark">✦</span><strong>thomazcrm</strong></div><h1>Entre na sua conta</h1><p>Organize leads, tarefas e oportunidades em um só lugar.</p><form id="lf"><label>E-mail<input name="e" type="email" required placeholder="admin@thomaz.com"></label><label>Senha<input name="p" type="password" required placeholder="123456"></label><button class="btn">Entrar no sistema</button></form><small>Demo: admin@thomaz.com / 123456<br>gestor@thomaz.com / 123456<br>ana@thomaz.com / 123456</small></section></main>';lf.onsubmit=function(e){e.preventDefault();var f=new FormData(lf),u=db.users.find(function(x){return x.e==f.get('e')&&x.p==f.get('p')});if(!u)return toast('E-mail ou senha inválidos');db.session=u.id;save();shell()}}
function shell(){app.innerHTML='<div class="app"><aside class="side"><div class="brand"><span class="mark">✦</span><strong>thomazcrm</strong></div><nav class="nav"><div class="nav-title">Workspace</div><button data-p="home">▦ <span>Visão geral</span></button><button data-p="leads">◉ <span>Leads</span></button><button data-p="kanban">▤ <span>Funil Kanban</span></button><button data-p="tasks">✓ <span>Tarefas</span></button><button data-p="reports">◒ <span>Relatórios</span></button><div class="nav-title">Conta</div><button data-p="users">♟ <span>Usuários</span></button></nav><div class="profile"><div class="avatar">'+ini(me().n)+'</div><div><strong>'+esc(me().n)+'</strong><small>'+esc(me().r)+'</small></div><button class="logout" id="out">↪</button></div></aside><section class="main"><header class="top"><div class="hello">Bem-vindo de volta,<strong>'+esc(me().n.split(' ')[0])+' 👋</strong></div><span class="role">'+esc(me().r)+'</span></header><main class="content" id="content"></main></section></div>';document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){page=b.dataset.p;render()}});out.onclick=function(){db.session=null;save();login()};render()}
function head(t,s,b){return '<div class="head"><div><h1>'+t+'</h1><p>'+s+'</p></div>'+(b||'')+'</div>'}function rows(){var q=search.toLowerCase();return db.leads.filter(function(l){return !q||[l.n,l.phone,l.email].join(' ').toLowerCase().includes(q)})}function table(ls){if(!ls.length)return '<div class="empty">Nenhum lead encontrado.</div>';return '<table class="table"><tr><th>Lead</th><th>Interesse</th><th>Etapa</th><th>Responsável</th></tr>'+ls.map(function(l){return '<tr><td><div class="person"><div class="avatar">'+ini(l.n)+'</div><div><strong>'+esc(l.n)+'</strong><small>'+esc(l.email||l.phone)+'</small></div></div></td><td>'+esc(l.interest)+'</td><td><span class="pill">'+stages[l.stage]+'</span></td><td>'+esc(who(l.owner))+'</td></tr>'}).join('')+'</table>'}
function home(){var n=db.leads.length,a=db.leads.filter(function(l){return l.stage>0&&l.stage<5}).length,g=db.leads.filter(function(l){return l.stage==5}).length,p=db.leads.filter(function(l){return l.stage==6}).length;return head('Visão geral','Acompanhe o desempenho do seu atendimento.','<button class="btn" id="new">＋ Novo lead</button>')+'<div class="cards"><div class="card"><span>Leads novos</span><strong>'+db.leads.filter(function(l){return l.stage==0}).length+'</strong><span class="trend">Neste funil</span></div><div class="card"><span>Em andamento</span><strong>'+a+'</strong><span class="trend">Oportunidades ativas</span></div><div class="card"><span>Leads ganhos</span><strong>'+g+'</strong><span class="trend">Convertidos</span></div><div class="card"><span>Leads perdidos</span><strong>'+p+'</strong><span class="trend">Para reavaliar</span></div></div><div class="grid"><section class="panel"><div class="section"><h2>Leads recentes</h2><button class="btn alt" data-p="leads">Ver todos</button></div>'+table(db.leads)+'</section><section class="panel"><h2>Próximas tarefas</h2>'+taskHtml(db.tasks.filter(function(t){return !t.done}))+'</section></div>'}
function leads(){return head('Leads','Cadastre, busque e acompanhe seus contatos.','<button class="btn" id="new">＋ Novo lead</button>')+'<section class="panel"><div class="filters"><input id="search" placeholder="Buscar por nome, telefone ou e-mail..." value="'+esc(search)+'"><button class="btn alt" id="csv">Exportar CSV</button></div><div id="results">'+table(rows())+'</div></section>'}function kanban(){return head('Funil Kanban','Arraste os cartões para atualizar a etapa.','<button class="btn" id="new">＋ Novo lead</button>')+'<div class="kanban">'+stages.map(function(s,i){return '<section class="column" data-stage="'+i+'"><div class="column-head"><b>'+s+'</b><span>'+db.leads.filter(function(l){return l.stage==i}).length+'</span></div>'+db.leads.filter(function(l){return l.stage==i}).map(function(l){return '<article class="lead" draggable="true" data-id="'+l.id+'"><span class="pill">'+esc(l.interest)+'</span><h3>'+esc(l.n)+'</h3><p>'+esc(who(l.owner))+' · retorno '+fmt(l.next)+'</p><a class="wa" target="_blank" href="https://wa.me/55'+l.phone+'">WhatsApp</a></article>'}).join('')+'</section>'}).join('')+'</div>'}function taskHtml(ls){if(!ls.length)return '<div class="empty">Tudo em dia 🎉</div>';return ls.map(function(t){var l=db.leads.find(function(x){return x.id==t.lead});return '<div class="task"><button class="check '+(t.done?'done':'')+'" data-task="'+t.id+'">'+(t.done?'✓':'')+'</button><div><b>'+esc(t.title)+'</b><small>'+esc(l?l.n:'Sem lead')+' · '+fmt(t.due)+'</small></div></div>'}).join('')}function tasks(){return head('Tarefas','Organize retornos e compromissos da equipe.','<button class="btn" id="tasknew">＋ Nova tarefa</button>')+'<section class="panel"><h2>Lista de tarefas</h2>'+taskHtml(db.tasks)+'</section>'}function reports(){var total=db.leads.length||1,win=db.leads.filter(function(l){return l.stage==5}).length;return head('Relatórios','Indicadores comerciais e produtividade.','<button class="btn alt" id="csv">Exportar CSV</button>')+'<div class="cards"><div class="card"><span>Total de leads</span><strong>'+db.leads.length+'</strong></div><div class="card"><span>Taxa de conversão</span><strong>'+Math.round(win/total*100)+'%</strong></div><div class="card"><span>Tarefas pendentes</span><strong>'+db.tasks.filter(function(t){return !t.done}).length+'</strong></div><div class="card"><span>Usuários</span><strong>'+db.users.length+'</strong></div></div><div class="grid"><section class="panel"><h3>Leads por origem</h3>'+['Site','Indicação','Instagram'].map(function(s){var n=db.leads.filter(function(l){return l.source==s}).length;return '<div class="section"><span>'+s+'</span><b>'+n+'</b></div><div class="bar"><i style="width:'+(n/total*100)+'%"></i></div>'}).join('')+'</section><section class="panel"><h3>Leads por responsável</h3>'+db.users.map(function(u){var n=db.leads.filter(function(l){return l.owner==u.id}).length;return '<div class="section"><span>'+u.n+'</span><b>'+n+'</b></div><div class="bar"><i style="width:'+(n/total*100)+'%"></i></div>'}).join('')+'</section></div>'}function users(){return head('Usuários','Perfis de acesso da equipe.','<button class="btn" id="usernew">＋ Novo usuário</button>')+'<section class="panel">'+table(db.users.map(function(u){return {n:u.n,email:u.e,interest:u.r,stage:0,owner:u.id}}))+'</section>'}
function modalLead(){var m=document.createElement('div');m.className='modalbg';m.innerHTML='<div class="modal"><div class="modalhead"><h2>Novo lead</h2><button class="close">×</button></div><form id="leadform"><div class="formgrid"><label>Nome<input name="n" required></label><label>Telefone<input name="phone" required></label><label>E-mail<input name="email" type="email"></label><label>Interesse<input name="interest" required></label><label>Origem<input name="source" value="Site"></label><label>Responsável<select name="owner">'+db.users.map(function(u){return '<option value="'+u.id+'">'+u.n+'</option>'}).join('')+'</select></label></div><div class="actions"><button type="button" class="btn alt close">Cancelar</button><button class="btn">Salvar lead</button></div></form></div>';document.body.append(m);m.querySelectorAll('.close').forEach(function(b){b.onclick=function(){m.remove()}});m.querySelector('#leadform').onsubmit=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));db.leads.push({id:Date.now(),n:d.n,phone:d.phone,email:d.email,interest:d.interest,source:d.source,owner:+d.owner,stage:0,next:''});save();m.remove();render();toast('Lead salvo')};}
function exportCsv(){var csv='Nome,Telefone,E-mail,Interesse,Origem\n'+db.leads.map(function(l){return [l.n,l.phone,l.email,l.interest,l.source].join(',')}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='leads.csv';a.click()}function render(){content.innerHTML=({home:home,leads:leads,kanban:kanban,tasks:tasks,reports:reports,users:users}[page]||home)();document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){page=b.dataset.p;render()}});var n=document.querySelector('#new');if(n)n.onclick=modalLead;var s=document.querySelector('#search');if(s)s.oninput=function(e){search=e.target.value;results.innerHTML=table(rows())};var c=document.querySelector('#csv');if(c)c.onclick=exportCsv;document.querySelectorAll('[data-task]').forEach(function(b){b.onclick=function(){var t=db.tasks.find(function(x){return x.id==b.dataset.task});t.done=!t.done;save();render()}});document.querySelectorAll('.lead').forEach(function(x){x.ondragstart=function(e){e.dataTransfer.setData('id',x.dataset.id)}});document.querySelectorAll('.column').forEach(function(x){x.ondragover=function(e){e.preventDefault()};x.ondrop=function(e){var l=db.leads.find(function(q){return q.id==e.dataTransfer.getData('id')});if(l){l.stage=+x.dataset.stage;save();render();toast('Etapa atualizada')}}})}if(db.session&&me())shell();else login();
</script>

<script>
(function(){
var filterState={q:'',stage:'all',source:'all',owner:'all',period:'all'};
function today(){return new Date().toISOString().slice(0,10)}
function ensureData(){
 db.leads=(db.leads||[]).map(function(l){l.history=l.history||[{kind:'Cadastro',text:'Lead criado no sistema',author:who(l.owner),date:l.createdAt||today()}];l.createdAt=l.createdAt||today();l.next=l.next||'';l.source=l.source||'Site';return l});
 db.tasks=(db.tasks||[]).map(function(t){t.status=t.status|| (t.done?'Concluída':'Pendente');t.due=t.due||today();return t});
 if(!db.stageNames)db.stageNames=stages.slice();
 if(!db.settings)db.settings={company:'Thomaz CRM'};
}
function saveData(){ensureData();save()}
function addHistory(l,kind,text){l.history=l.history||[];l.history.unshift({kind:kind,text:text,author:me()?me().n:'Sistema',date:today()})}

function reportsPlus(){var total=db.leads.length||1,won=db.leads.filter(function(l){return l.stage==5}).length;var sources=[].concat(db.leads.map(function(l){return l.source||'Site'})).filter(function(v,i,a){return a.indexOf(v)===i});var ranking=db.users.map(function(u){var mine=db.leads.filter(function(l){return l.owner==u.id}),wins=mine.filter(function(l){return l.stage==5}).length,lost=mine.filter(function(l){return l.stage==6}).length,active=mine.length-wins-lost;return {u:u,total:mine.length,wins:wins,lost:lost,active:active,rate:mine.length?Math.round(wins/mine.length*100):0}}).sort(function(a,b){return b.wins-a.wins||b.total-a.total||a.u.n.localeCompare(b.u.n)});var maxAssigned=Math.max.apply(null,ranking.map(function(x){return x.total}).concat([1]));var rankingHtml=ranking.map(function(x,i){return '<tr><td><div class="rank-person"><span class="rank-badge">'+(i+1)+'</span><div class="person"><div class="avatar">'+ini(x.u.n)+'</div><div><strong>'+esc(x.u.n)+'</strong><small>'+esc(x.u.r)+'</small></div></div></div></td><td>'+x.total+'</td><td>'+x.active+'</td><td>'+x.wins+'</td><td>'+x.lost+'</td><td><span class="pill">'+x.rate+'%</span></td></tr>'}).join('');var sourceBars=sources.map(function(s){var n=db.leads.filter(function(l){return (l.source||'Site')===s}).length;return '<div class="section"><span>'+esc(s)+'</span><b>'+n+'</b></div><div class="bar"><i style="width:'+(n/total*100)+'%"></i></div>'}).join('');var funnelBars=stages.map(function(s,i){var n=db.leads.filter(function(l){return l.stage==i}).length;return '<div class="section"><span>'+esc(s)+'</span><b>'+n+'</b></div><div class="bar"><i style="width:'+(n/total*100)+'%"></i></div>'}).join('');var productivity=ranking.map(function(x){return '<div class="section"><span>'+esc(x.u.n)+'</span><b>'+x.total+' leads · '+x.wins+' ganhos</b></div><div class="bar"><i style="width:'+(x.total/maxAssigned*100)+'%"></i></div>'}).join('');return h('Relatórios','Indicadores comerciais, desempenho da equipe e produtividade.','<div class="mobile-stack no-print"><button class="btn alt" id="printReports">Imprimir</button><button class="btn alt" id="pdfReports">Salvar PDF</button><button class="btn alt" id="exportCsv">Exportar CSV</button></div>')+'<div class="cards"><div class="card"><span>Total de leads</span><strong>'+db.leads.length+'</strong><span class="trend">Base cadastrada</span></div><div class="card"><span>Conversão</span><strong>'+Math.round(won/total*100)+'%</strong><span class="trend">Leads ganhos</span></div><div class="card"><span>Tarefas pendentes</span><strong>'+db.tasks.filter(function(t){return !t.done}).length+'</strong><span class="trend">Acompanhamentos</span></div><div class="card"><span>Interações registradas</span><strong>'+db.leads.reduce(function(n,l){return n+(l.history||[]).length},0)+'</strong><span class="trend">Atividade comercial</span></div></div><section class="panel report-panel" style="margin-top:20px"><div class="section"><div><h2>Ranking de atendimento</h2><p class="muted">Desempenho por responsável, ordenado por leads ganhos e volume atendido.</p></div><span class="report-icon">★</span></div><div class="report-table-wrap"><table class="table ranking-table"><tr><th>Atendente</th><th>Leads</th><th>Em andamento</th><th>Ganhos</th><th>Perdidos</th><th>Conversão</th></tr>'+rankingHtml+'</table></div></section><div class="grid"><section class="panel"><h2>Leads por origem</h2>'+sourceBars+'</section><section class="panel"><h2>Produtividade da equipe</h2>'+productivity+'</section></div><div class="grid"><section class="panel"><h2>Etapas do funil</h2>'+funnelBars+'</section><section class="panel"><h2>Resumo da operação</h2><div class="report-summary"><div><b>'+db.leads.filter(function(l){return l.stage>0&&l.stage<5}).length+'</b><span>Em atendimento</span></div><div><b>'+won+'</b><span>Ganhos</span></div><div><b>'+db.leads.filter(function(l){return l.stage==6}).length+'</b><span>Perdidos</span></div></div></section></div>'}

function leadModal(id){var l=id?db.leads.find(function(x){return x.id==id}):null;var body='<form id="leadForm"><div class="modalgrid"><label>Nome<input name="n" required value="'+esc(l?l.n:'')+'"></label><label>Telefone<input name="phone" required value="'+esc(l?l.phone:'')+'"></label><label>E-mail<input name="email" type="email" value="'+esc(l?l.email:'')+'"></label><label>Empresa<input name="company" value="'+esc(l?l.company:'')+'"></label><label>Interesse<input name="interest" required value="'+esc(l?l.interest:'')+'"></label><label>Origem<input name="source" value="'+esc(l?l.source:'Site')+'"></label><label>Etapa<select name="stage">'+stages.map(function(s,i){return '<option value="'+i+'" '+(l&&l.stage==i?'selected':'')+'>'+esc(s)+'</option>'}).join('')+'</select></label><label>Responsável<select name="owner">'+db.users.map(function(u){return '<option value="'+u.id+'" '+(l&&l.owner==u.id?'selected':'')+'>'+esc(u.n)+'</option>'}).join('')+'</select></label><label>Próximo retorno<input name="next" type="date" value="'+esc(l?l.next:'')+'"></label><label class="wide">Observações<textarea name="notes">'+esc(l?l.notes:'')+'</textarea></label></div><div class="actions"><button type="button" class="btn alt close">Cancelar</button><button class="btn">Salvar lead</button></div></form>';var m=modalBox(l?'Editar lead':'Novo lead',body);m.querySelectorAll('.close').forEach(function(b){b.onclick=function(){m.remove()}});m.querySelector('#leadForm').onsubmit=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));var dup=db.leads.find(function(x){return x.id!==(l&&l.id)&&((d.phone&&x.phone===d.phone)||(d.email&&x.email&&x.email.toLowerCase()===d.email.toLowerCase()))});if(dup&&!confirm('Possível duplicidade com '+dup.n+'. Deseja salvar mesmo assim?'))return;if(l){Object.assign(l,{n:d.n,phone:d.phone,email:d.email,company:d.company,interest:d.interest,source:d.source,stage:+d.stage,owner:+d.owner,next:d.next,notes:d.notes});addHistory(l,'Atualização','Dados do lead foram atualizados')}else{var nl={id:Date.now(),n:d.n,phone:d.phone,email:d.email,company:d.company,interest:d.interest,source:d.source,stage:+d.stage,owner:+d.owner,next:d.next,notes:d.notes,createdAt:today(),history:[]};addHistory(nl,'Cadastro','Lead criado no sistema');db.leads.unshift(nl)}saveData();m.remove();render();toast(l?'Lead atualizado':'Lead criado')}}
function leadDetail(id){var l=db.leads.find(function(x){return x.id==id});if(!l)return;var hist=(l.history||[]).map(function(x){return '<div class="timeline-item"><b>'+esc(x.kind)+' · '+esc(x.author)+'</b><p>'+esc(x.text)+'</p><small>'+fmt(x.date)+'</small></div>'}).join('');var related=db.tasks.filter(function(t){return t.lead==l.id});var body='<div class="section"><div><h3 style="margin:0">'+esc(l.n)+'</h3><p class="muted">'+esc(l.company||'Sem empresa')+' · '+esc(l.email||l.phone)+'</p></div><div class="mobile-stack"><a class="wa" target="_blank" href="https://wa.me/55'+String(l.phone||'').replace(/\\D/g,'')+'">Abrir WhatsApp</a><button class="btn alt" id="editLead">Editar</button></div></div><div class="cards" style="grid-template-columns:repeat(3,1fr);margin-top:18px"><div class="card"><span>Etapa</span><strong style="font-size:17px">'+esc(stageLabel(l.stage))+'</strong></div><div class="card"><span>Responsável</span><strong style="font-size:17px">'+esc(who(l.owner))+'</strong></div><div class="card"><span>Próximo retorno</span><strong style="font-size:17px">'+fmt(l.next)+'</strong></div></div><p>'+esc(l.notes||'Sem observações.')+'</p><hr><h3>Nova interação</h3><form id="interactionForm" class="modalgrid"><label>Tipo<select name="kind"><option>Ligação</option><option>Mensagem</option><option>Reunião</option><option>Anotação</option></select></label><label class="wide">Descrição<textarea name="text" required placeholder="O que aconteceu?"></textarea></label><div class="actions wide"><button class="btn">Registrar interação</button></div></form><h3 style="margin-top:22px">Histórico</h3><div class="timeline">'+(hist||'<div class="empty">Nenhuma interação registrada.</div>')+'</div><hr><h3>Nova tarefa</h3><form id="taskForm" class="modalgrid"><label>Descrição<input name="title" required></label><label>Prazo<input name="due" type="date" required value="'+today()+'"></label><div class="actions wide"><button class="btn alt">Adicionar tarefa</button></div></form><div>'+taskList(related)+'</div>';var m=modalBox('Detalhes do lead',body);m.querySelector('#editLead').onclick=function(){m.remove();leadModal(l.id)};m.querySelector('#interactionForm').onsubmit=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));addHistory(l,d.kind,d.text);l.lastInteraction=today();saveData();m.remove();leadDetail(l.id);toast('Interação registrada')};m.querySelector('#taskForm').onsubmit=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));db.tasks.push({id:Date.now(),lead:l.id,title:d.title,due:d.due,done:false,status:'Pendente'});saveData();m.remove();leadDetail(l.id);toast('Tarefa adicionada')};m.querySelectorAll('[data-task]').forEach(function(b){b.onclick=function(){var t=db.tasks.find(function(x){return x.id==b.dataset.task});t.done=!t.done;t.status=t.done?'Concluída':'Pendente';saveData();m.remove();leadDetail(l.id)}})}
function importCsv(file){var reader=new FileReader();reader.onload=function(){var lines=reader.result.split(/\\r?\\n/).filter(Boolean);if(lines.length<2)return toast('CSV sem registros');var added=0,dups=0;lines.slice(1).forEach(function(line){var c=line.split(',');if(!c[0])return;var d=db.leads.find(function(x){return (c[1]&&x.phone===c[1])||(c[2]&&x.email===c[2])});if(d){dups++;return}var l={id:Date.now()+added,n:c[0].trim(),phone:(c[1]||'').trim(),email:(c[2]||'').trim(),interest:(c[3]||'').trim()||'Novo atendimento',source:(c[4]||'CSV').trim(),owner:me().id,stage:0,history:[]};addHistory(l,'Importação','Lead importado por CSV');db.leads.push(l);added++});saveData();render();toast(added+' lead(s) importado(s)'+(dups?' · '+dups+' duplicado(s) ignorado(s)':''))};reader.readAsText(file)}

 document.querySelectorAll('[data-up]').forEach(function(b){b.onclick=function(){var i=+b.dataset.up;if(i>0){var x=stages[i];stages[i]=stages[i-1];stages[i-1]=x;db.stageNames=stages;saveData();render()}}});
 document.querySelectorAll('[data-down]').forEach(function(b){b.onclick=function(){var i=+b.dataset.down;if(i<stages.length-1){var x=stages[i];stages[i]=stages[i+1];stages[i+1]=x;db.stageNames=stages;saveData();render()}}});
 document.querySelectorAll('[data-stage-name]').forEach(function(e){e.onchange=function(){var i=+e.dataset.stageName;stages[i]=e.value||stages[i];db.stageNames=stages;saveData();render()}});
 var ad=document.getElementById('addStage');if(ad)ad.onclick=function(){var s=prompt('Nome da nova etapa');if(s){stages.push(s);db.stageNames=stages;saveData();render()}};
 document.querySelectorAll('[data-remove]').forEach(function(b){b.onclick=function(){if(stages.length<=2)return toast('Mantenha pelo menos duas etapas');var i=+b.dataset.remove;if(confirm('Excluir esta etapa? Os leads serão movidos para Novo lead.')){db.leads.forEach(function(l){if(l.stage===i)l.stage=0});stages.splice(i,1);db.stageNames=stages;saveData();render()}}});
}
